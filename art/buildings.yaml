# A station's project (v1.2 §12): one shared building in the corner of the station's Yard, growing stage by stage
- { id: hub-project-foundation, size: 4, look: "the first stage of a shared village building: a wide square stone foundation platform with a low wall, a few stacked stone blocks and timber beams, a small wooden crane and a surveyor's flag, the start of something big; warm and hopeful" }
- { id: hub-project-waterTower, size: 4, look: "a charming village water tower on a square stone base: a round riveted copper tank on four sturdy brick legs, a ladder, a little pointed roof with a weather vane, pipes running down into the base, a small pump house beside it" }
- { id: hub-project-workshop, size: 4, look: "a shared village workshop on a square stone base: a long brick hall with big arched wooden doors, a sawtooth roof with skylights, a chimney with a wisp of smoke, workbenches and crates of tools outside, beside the water tower's base" }
- { id: hub-project-foundryHall, size: 4, look: "a grand foundry hall on a square stone base: a tall brick and iron hall with tall glowing windows, two brick chimneys with smoke, a big crane arm, molten-orange light from the open doors, stacks of ingots" }
- { id: hub-project-landmark, size: 4, look: "a magnificent village landmark on a square stone base: an ornate clock tower of pale stone and brass with a copper dome, coloured banners, a fountain at its foot, arches and lanterns, the proud heart of the station" }
