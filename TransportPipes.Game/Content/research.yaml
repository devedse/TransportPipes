# Research (GDD §8.3). Labs make research points (RP); a tech costs RP and takes time.
# Knowledge diffusion: a tech is up to 50% cheaper when more active companies already have it.
# Unlocks: buildings and pipe tiers name the tech they need (unlock.research / research).
# effects: bonuses for the company that has the tech
#   output: { targets: ["building:smelter"], amount: 0.25 }   +25% output of matching buildings (quote the targets)
#   targets: modifier:wind | modifier:sun | building:<id> | category:<category> | resource:<resource>
#   throughput: { amount: 0.5 }                +50% throughput of your pipes
#   bandWidth: { amount: 0.1 }                 your prices may go 10% further outside the fair band (Economy)
#   managerSlots: { amount: 1 }                one more manager slot

# ---------------------------------------------------------------- Era 1
- id: betterBearings
  name: Better Bearings
  branch: energy
  era: 1
  cost: 150
  minutes: 5
  effects: [{ output: { targets: ["modifier:wind"], amount: 0.25 } }]
  description: Smoother wind moilies. +25% output of everything that runs on wind.

- id: solarTracking
  name: Solar Tracking
  branch: energy
  era: 1
  cost: 150
  minutes: 5
  effects: [{ output: { targets: ["modifier:sun"], amount: 0.25 } }]
  description: Panels follow the sun. +25% output of everything that runs on sunlight.

- id: hydroWheel
  name: Hydro Wheel
  branch: energy
  era: 1
  cost: 250
  minutes: 10
  description: Unlocks the Hydro Wheel, steady energy from a river or lake.

- id: oreWashing
  name: Ore Washing
  branch: industry
  era: 1
  cost: 200
  minutes: 10
  effects: [{ output: { targets: ["resource:ironOre", "resource:copperOre", "resource:coal"], amount: 0.1 } }]
  description: Cleaner ore from the same rock. +10% iron ore, copper ore and coal.

- id: doubleFurnace
  name: Double Furnace
  branch: industry
  era: 1
  cost: 300
  minutes: 15
  requires: [oreWashing]
  effects: [{ output: { targets: ["building:smallFactory", "building:smelter", "building:bigFactory"], amount: 0.15 } }]
  description: A second furnace in every factory. +15% output of factories and smelters.

- id: bigFactory
  name: Big Factory
  branch: industry
  era: 1
  cost: 500
  minutes: 20
  requires: [doubleFurnace]
  description: Unlocks the Big Factory, five times a Small Factory on four tiles.

- id: copperPipes
  name: Copper Pipes
  branch: logistics
  era: 1
  cost: 200
  minutes: 10
  description: Unlocks Copper Pipes, half the losses and five times the throughput of grey pipes.

- id: valves
  name: Valves
  branch: logistics
  era: 1
  cost: 300
  minutes: 15
  requires: [copperPipes]
  description: Unlocks Valves (only chosen resources pass) and Priority Valves (served first).

- id: pumpStations
  name: Pump Stations
  branch: logistics
  era: 1
  cost: 400
  minutes: 20
  requires: [valves]
  description: Unlocks Pump Stations. A network needs one for every 50 buildings.

- id: contracts2
  name: Contracts II
  branch: economy
  era: 1
  cost: 400
  minutes: 20
  description: Longer contracts and more of them at the same time.

- id: marketInsight
  name: Market Insight
  branch: economy
  era: 1
  cost: 300
  minutes: 15
  description: See where the hub prices are heading.

- id: haggling
  name: Haggling
  branch: economy
  era: 1
  cost: 350
  minutes: 15
  requires: [marketInsight]
  effects: [{ bandWidth: { amount: 0.1 } }]
  description: Your prices for neighbours may go 10% further than the fair band.

