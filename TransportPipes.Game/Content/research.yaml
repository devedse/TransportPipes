# Research (1.4 §12): two lines in your Lab, each working on one thing at a time with a queue of five, also while you're
# away. Research costs gold (and from tier 3 a track's own goods) when it starts, but mostly time.
#
# The first line: tracks. Deep research for one chain, nine tiers over about ten days; a master's chain is fifteen
# times better. Every Era's tracks cost four times the gold of the Era before; their times stay.
#   faster: the chain's buildings work faster (everything they take and make, like extra levels)
#   leaner: they need less of every input for the same output (wind, sun and water power make more instead)
#   complexes: four 1×1 buildings in a square merge into a 2×2 with the output of five; bigger buildings get +25%
#   megaComplexes: nine in a 3×3 square give the output of twelve; bigger buildings get +33%
#   master: the last ×2, golden trim and a title
# From tier hubOrderFrom every tier also makes your Hub Orders for the track's goods hubOrderPerTier times bigger.
tiers:
  - { minutes: 10,   effect: faster,        amount: 1.25,   gold: 500 }
  - { minutes: 60,   effect: leaner,        amount: 0.8,    gold: 3000 }
  - { minutes: 240,  effect: faster,        amount: 1.5,    gold: 20000 }
  - { minutes: 720,  effect: complexes,     amount: 1.25,   gold: 100000 }
  - { minutes: 1440, effect: faster,        amount: 2,      gold: 500000 }
  - { minutes: 2160, effect: leaner,        amount: 0.7,    gold: 2000000 }
  - { minutes: 2880, effect: faster,        amount: 2,      gold: 8000000 }
  - { minutes: 2880, effect: megaComplexes, amount: 1.3333, gold: 20000000 }
  - { minutes: 3600, effect: master,        amount: 2,      gold: 50000000 }
# From this tier a tier also takes the track's own good, worth this share of its gold
tierGoodsFrom: 3
tierGoodsShare: 0.2
hubOrderFrom: 5
hubOrderPerTier: 1.8
# Wind, sun and water power: what the leaner tiers give instead of saving inputs (×1.2 at tier 2, ×1.3 at tier 6)
leanerOutput: [1.2, 1.3]

# strength: the share of each faster tier's boost (Power counts half: every building uses energy)
# buildings: what the track makes better (a Coal Pit and the Deep Mine on coal follow the better of Copper and Stone)
# goods: whose Hub Orders it raises from tier 5; good: what tiers from 3 also take
tracks:
  # Era 1 · Steam & Iron
  - { id: power,  name: Power,  era: 1, strength: 0.5, goods: [energy, water], buildings: [solarPanel, windMoily, hydroWheel, coalPlant, bigTurbine, steamTurbine, solarFarm, geothermalPlant, fusionReactor, magmaTap, waterPump], description: "Every energy building of every Era, and Water Pumps. Its faster tiers count half." }
  - { id: iron,   name: Iron,   era: 1, good: ironIngot,   goods: [ironOre, ironIngot],          buildings: [ironMine, smallFactory, bigFactory, deepMine:ironOre], description: "Iron Mines, the Deep Mine on iron, Small and Big Factories." }
  - { id: copper, name: Copper, era: 1, good: copperIngot, goods: [copperOre, coal, copperIngot], buildings: [copperMine, coalPit, smelter, deepMine:copperOre, deepMine:coal], description: "Copper Mines, Coal Pits, the Deep Mine on copper or coal, Smelters." }
  - { id: stone,  name: Stone,  era: 1, good: bricks,      goods: [stone, coal, bricks],         buildings: [quarry, coalPit, brickworks, deepMine:coal], description: "Quarries, Coal Pits, Brickworks." }
  - { id: sand,   name: Sand,   era: 1, good: glass,       goods: [sand, glass],                 buildings: [sandDredger, glassworks], description: "Sand Dredgers and Glassworks." }
  - { id: wood,   name: Wood,   era: 1, good: planks,      goods: [wood, planks],                buildings: [lumberCamp, sawmill], description: "Lumber Camps and Sawmills." }
  # Era 2 · Electric
  - { id: steel,     name: Steel,     era: 2, good: steel,      goods: [steel],               buildings: [steelMill], description: "Steel Mills." }
  - { id: wire,      name: Wire,      era: 2, good: copperWire, goods: [copperWire],          buildings: [wireMill], description: "Wire Mills." }
  - { id: concrete,  name: Concrete,  era: 2, good: concrete,   goods: [concrete],            buildings: [cementKiln], description: "Cement Kilns." }
  - { id: aluminium, name: Aluminium, era: 2, good: aluminium,  goods: [bauxite, aluminium],  buildings: [bauxitePit, aluminiumWorks], description: "Bauxite Pits and Aluminium Works." }
  # Era 3 · Oil & Machines
  - { id: oil,    name: Oil,    era: 3, good: plastic, goods: [oil, plastic], buildings: [oilDerrick, refinery], description: "Oil Derricks and Refineries." }
  - { id: gears,  name: Gears,  era: 3, good: gears,   goods: [gears],        buildings: [machineShop], description: "Machine Shops." }
  - { id: motors, name: Motors, era: 3, good: motors,  goods: [motors],       buildings: [motorWorks], description: "Motor Works." }
  - { id: lines,  name: Lines,  era: 3, good: steel,   goods: [],             buildings: [], description: "No building: your trunk lines and links cost less a tile and lose less; the master builds superconductor lines." }
  # Era 4 · Electronics
  - { id: rareEarth, name: Rare Earth, era: 4, good: rareEarth, goods: [rareEarth], buildings: [rareEarthExcavator], description: "Rare Earth Excavators." }
  - { id: circuits,  name: Circuits,   era: 4, good: circuits,  goods: [circuits],  buildings: [circuitFab], description: "Circuit Fabs." }
  - { id: batteries, name: Batteries,  era: 4, good: batteries, goods: [batteries], buildings: [batteryWorks], description: "Battery Works." }
  - { id: robots,    name: Robots,     era: 4, good: robots,    goods: [robots],    buildings: [robotWorks], description: "Robot Works." }
  # Era 5 · Space Age
  - { id: titanium,        name: Titanium,        era: 5, good: titanium,        goods: [titaniumOre, titanium], buildings: [titaniumMine, titaniumWorks], description: "Titanium Mines and Titanium Works." }
  - { id: superconductors, name: Superconductors, era: 5, good: superconductors, goods: [superconductors],       buildings: [superconductorLab], description: "Superconductor Labs." }
  - { id: spaceframes,     name: Spaceframes,     era: 5, good: spaceframes,     goods: [spaceframes],           buildings: [spaceframeWorks], description: "Spaceframe Works." }

# The second line: the Era tree. Short research that opens an Era's pipes, buildings and systems, priced at about an
# hour of income when the Era begins (Eras 3–5 from the model: 2.8M, 12M and 35M g a minute for a regular player).
# grant: every company gets it at that Company Level
tree:
  # Era 1
  - { id: copperPipes,  name: Copper Pipes,  era: 1, minutes: 10, gold: 300,  grant: 8, description: "Copper pipes: fifty times what a grey pipe carries, half its loss. Everyone gets them at Level 8 anyway." }
  - { id: valves,       name: Valves,        era: 1, minutes: 15, gold: 500,  description: "Valves (only chosen goods pass) and Priority Valves (served first)." }
  - { id: pumpStations, name: Pump Stations, era: 1, minutes: 20, gold: 800,  description: "Pump Stations: a network needs one for every 50 buildings." }
  - { id: bigFactory,   name: Big Factory,   era: 1, minutes: 30, gold: 2000, grant: 12, description: "The Big Factory before Level 12: iron ingots on a bigger scale. Everyone gets it at Level 12 anyway." }
  # Era 2
  - { id: steelPipes,  name: Steel Pipes,           era: 2, minutes: 60,  gold: 5000000,  description: "Steel pipes: ten times what a copper pipe carries." }
  - { id: powerLines,  name: Power Lines,           era: 2, minutes: 60,  gold: 10000000, description: "Power Line Pylons: energy only, no loss, no limit, across water." }
  - { id: silos,       name: Silos,                 era: 2, minutes: 60,  gold: 10000000, description: "The Silo: half a million units of storage." }
  - { id: deepMining,  name: Deep Mining,           era: 2, minutes: 120, gold: 20000000, description: "The Deep Mine on rich (★3 or more) deposits of iron ore, copper ore and coal." }
  - { id: survey,      name: Survey the Outskirts,  era: 2, minutes: 120, gold: 30000000, description: "Buy the nine outskirts parcels set aside for your plot." }
  # Era 3
  - { id: compositePipes, name: Composite Pipes, era: 3, minutes: 240, gold: 200000000, description: "Composite pipes: ten times what a steel pipe carries." }
  - { id: trains,         name: Trains,          era: 3, minutes: 240, gold: 200000000, description: "Cargo Depots carry twice as much and Exchange cargo travels twice as fast." }
  - { id: trunkLines,     name: Trunk Lines,     era: 3, minutes: 360, gold: 300000000, description: "Build trunk lines from a town gate to other towns." }
  - { id: deepLift,       name: The Deep Lift,   era: 3, minutes: 480, gold: 400000000, description: "The Deep Level under your plot, the Magma Tap and the Vault." }
  - { id: terraforming,   name: Terraforming,    era: 3, minutes: 720, gold: 600000000, description: "The Terraformer: reshape your land, or seed a deposit you lack." }
  # Era 4
  - { id: glassConduit, name: Glass Conduit, era: 4, minutes: 720, gold: 800000000, description: "Glass conduits: ten times what a composite pipe carries." }
  - { id: outposts,     name: Outposts,      era: 4, minutes: 720, gold: 1000000000, description: "Claims in the wilderness: up to three outposts on rich deposits." }
  - { id: automation,   name: Automation,    era: 4, minutes: 480, gold: 800000000, managerSlots: 1, description: "One more manager." }
  - { id: quantumLink,  name: Quantum Link,  era: 4, minutes: 960, gold: 1200000000, description: "The Quantum Link: joins two of your own networks anywhere, 2% lost." }
  # Era 5
  - { id: superconductorPipes, name: Superconductor Pipes, era: 5, minutes: 1440, gold: 3000000000, description: "Superconductor pipes: no limit and no loss." }
  - { id: orbitalLogistics,    name: Orbital Logistics,    era: 5, minutes: 1440, gold: 3000000000, description: "Quantum Links carry four times as much." }
