# All buildings. Rates (in/out) are per minute at level 1.
# kind: producer | storage | tradingPost | lab | hq | gate | valve | priorityValve | pump | cargoDepot | depot
#       | workshop | weatherStation | recycler | expeditionOffice | blueprintOffice | deepLift | teleporter | terraformer
#       | powerLine | decoration
# placement.terrain: allowed terrain (default: grass, hills, forest, desert, beach)
# placement.deposit: needs a deposit of that resource under the footprint
# placement.shore: needs water next to the footprint
# placement.forest: needs forest tiles within 2 tiles
# modifier: wind | sun | richness | forest
# Costs, rates and unlocks are 1.4 §10 and §14: Eras 2-5 cost gold and goods of earlier Eras and pay back in about 1½,
# 3, 6 and 12 hours at level 1; a building adds about 25 g a tile a minute in Era 1 and four times that each Era after.

