# All buildings. Rates (in/out) are per minute at level 1.
# kind: producer | storage | tradingPost | lab | hq | gate | valve | priorityValve | pump | tollMeter | cargoDepot
#       | exchangeOffice | showroom | workshop | weatherStation | recycler | expeditionOffice | blueprintOffice
#       | deepLift | bank | teleporter | terraformer | powerLine | corporationHq | decoration
# placement.terrain: allowed terrain (default: grass, hills, forest, desert, beach)
# placement.deposit: needs a deposit of that resource under the footprint
# placement.shore: needs water next to the footprint
# placement.forest: needs forest tiles within 2 tiles
# modifier: wind | sun | richness | forest

