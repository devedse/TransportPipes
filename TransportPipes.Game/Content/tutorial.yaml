# Loady's guide through the first session (GDD §10.2). A step is done when the stat reaches the amount; built:<type>
# counts that building type. hint tells the client what "Show me" does: a tool, a building, an overlay or a panel.
- { id: firstPanel, stat: "built:solarPanel", amount: 1, gold: 100, hint: { tool: build, building: solarPanel, overlay: sun },
    text: "Hi, I'm Loady! This valley is yours. Let's make money: build a Solar Panel on a sunny spot." }
- { id: firstSale, stat: earned, amount: 0.01, gold: 150, hint: { tool: pipe },
    text: "Now drag a pipe from the panel to your Trading Post. It sells everything you make to the hub." }
- { id: firstUpgrade, stat: levelsBought, amount: 1, gold: 150, hint: { select: solarPanel },
    text: "Coins! Click the panel and upgrade it: every level makes 10% more, and level 10 doubles it." }
- { id: firstMoily, stat: "built:windMoily", amount: 1, gold: 200, hint: { tool: build, building: windMoily, overlay: wind },
    text: "Find a windy spot (the Wind overlay shows it) and build a Wind Moily: six times the energy of a panel." }
- { id: firstMine, stat: "built:ironMine", amount: 1, gold: 300, hint: { tool: build, building: ironMine, overlay: deposits },
    text: "At Company Level 2 you can mine. Build an Iron Mine on an iron deposit (see the Deposits overlay)." }
- { id: firstIngot, stat: "produced:ironIngot", amount: 1, gold: 400, hint: { tool: build, building: smallFactory },
    text: "Ore is worth more as ingots. Build a Small Factory and connect it to the mine and your energy." }
- { id: firstNeighbour, stat: partners, amount: 1, gold: 500, hint: { panel: neighbours },
    text: "Your neighbours pay more than the hub. Open Neighbours and connect to one that needs what you make." }
- { id: firstParcel, stat: parcels, amount: 5, gold: 500, hint: { panel: parcel },
    text: "Room to grow: click a dark parcel next to your land and buy it." }
- { id: firstResearch, stat: researched, amount: 1, gold: 800, hint: { tool: build, building: lab },
    text: "Build a Lab, connect energy and iron ingots, and pick your first research." }
