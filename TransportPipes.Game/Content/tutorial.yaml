# Loady's guide through the first session (GDD §10.2) and the next two (§10.3: the Lab at Company Level 4, a parcel at
# 5). A step is done when the stat reaches the amount; built:<type> counts that building type. hint tells the client
# what "Show me" does: a tool, a building, an overlay or a panel. A step that needs a higher Company Level says so
# (GameWorld.TutorialWaitLevel).
- { id: firstPanel, stat: "built:solarPanel|windMoily", amount: 1, gold: 100, hint: { tool: build, building: solarPanel, overlay: sun },
    text: "Hi, I'm Loady! This plot is yours, and it starts empty. Build a Solar Panel on a sunny spot (or a Wind Moily): it makes energy." }
- { id: firstSale, stat: "piped:solarPanel|windMoily", amount: 1, gold: 150, hint: { tool: pipe },
    text: "Now pipe it: pick the Pipe tool (P), then drag from your panel to the pipe next to it. Pipes carry what it makes to your Trading Post.",
    phoneText: "Now pipe it to your Trading Post: Show me plans the pipe, and one tap lays it. Pipes carry what it makes to be sold." }
- { id: firstUpgrade, stat: levelsBought, amount: 1, gold: 150, hint: { select: paying },
    text: "Coins! Upgrade a building: every level makes 10% more, up to level 25, and every fifth level earns it a star. Show me opens the one where a level pays back soonest." }
- { id: firstMoily, stat: "built:solarPanel|windMoily", amount: 2, gold: 200, hint: { tool: build, building: windMoily, overlay: wind },
    text: "More energy, more gold. Find a windy spot (the Wind overlay shows it) and build a Wind Moily: six times a panel." }
- { id: firstYard, stat: yard, amount: 1, gold: 500, hint: { panel: yard },
    text: "The yellow posts and raised barrier are your Yard gate. Drag a pipe from your network onto either post: it snaps to the gate. Show me plans the connection for you. Your neighbours can then buy your spare goods at the price on your stall." }
- { id: firstMine, stat: "built:ironMine", amount: 1, gold: 300, hint: { tool: build, building: ironMine, overlay: deposits },
    text: "Mine the iron on your land: build an Iron Mine on an iron deposit (the Deposits overlay shows them)." }
- { id: firstIngot, stat: "produced:ironIngot", amount: 1, gold: 400, hint: { tool: build, building: smallFactory },
    text: "Put a Small Factory on the pipe from your Iron Mine to your Trading Post: it takes ore and energy there and sends its ingots on to be sold. Goods never pass through a building." }
- { id: firstStorage, stat: "built:storage", amount: 1, gold: 300, hint: { tool: build, building: storage },
    text: "Build a Storage on your pipes. It keeps what your buildings make for your next buildings and pipes: a building short of materials takes them from it." }
- { id: firstOrder, stat: orders, amount: 1, gold: 500, hint: { panel: hub },
    text: "The hub posts up to three orders a day, one for each good your trading post sells, and pays twice the price for them. Keep selling: they fill by themselves (Hub › Daily orders shows how far)." }
- { id: firstResearch, stat: researched, amount: 1, gold: 800, hint: { tool: build, building: lab },
    text: "Build a Lab and pick your first research: a track makes one chain's buildings better, the Era tree opens new pipes and buildings. Research costs gold, then time, and runs on while you're away." }
- { id: firstParcel, stat: parcels, amount: 5, gold: 1000, hint: { panel: parcel },
    text: "Room to grow: click a dark parcel next to your land and buy it." }

# Chapter 2 (docs/v1.1-design.html §5): the middle game, one goal at a time, each a few minutes of income as a
# thank-you. A building list in the hint is built in that order (Show me picks the first one missing); a step waits
# for the Company Level its next building or the next parcel needs.
- { id: copperIngots, chapter: 2, stat: "produced:copperIngot", amount: 1, gold: 3000, hint: { tool: build, building: "copperMine,coalPit,smelter", overlay: deposits },
    text: "Chapter 2: copper ingots, worth much more than the ore. A Smelter needs copper ore and coal: mine what your land holds (the Deposits overlay shows it), and pipe the Smelter to your Yard gate: a neighbour's or the market's brings the rest." }
- { id: firstMilestone, chapter: 2, stat: maxLevel, amount: 10, gold: 2500, hint: { select: highest },
    text: "At level 10 a building makes 2.4 times what it made at level 1, and its badge turns blue: Superior. Upgrade one of your buildings to level 10." }
- { id: copperPipe, chapter: 2, stat: pipeTiers, amount: 1, gold: 3000, hint: { select: pipeFull },
    text: "A pipe carries only so much between two buildings: a grey one 100 a minute. When a building's pipe is full, its panel shows the way up: a Copper Pipe carries fifty times as much, and the levels after it pay again. Lay your first Copper Pipe." }
- { id: threeResearches, chapter: 2, stat: researched, amount: 3, gold: 3000, hint: { panel: research },
    text: "Research is a plan, not a list: the tracks of the chains you make, and the Era tree beside them (your Lab works on both at once). Finish three researches." }
- { id: moreOrders, chapter: 2, stat: orders, amount: 4, gold: 3000, hint: { panel: hub },
    text: "Fill three more of the hub's daily orders: they buy at twice the price from what your trading post sells." }
- { id: neighbourIncome, chapter: 2, stat: neighbourIncome, amount: 30, gold: 4000, hint: { panel: yard },
    text: "Your Yard pays more than the market. Earn 30 gold a minute from your neighbours: make what they lack (the Yard shows it)." }
- { id: secondParcel, chapter: 2, stat: parcels, amount: 6, gold: 5000, hint: { panel: parcel },
    text: "Room for the next chain: buy your second parcel. The parcel panel shows what each one holds." }
- { id: bricks, chapter: 2, stat: "produced:bricks", amount: 1, gold: 8000, hint: { tool: build, building: "quarry,coalPit,brickworks", overlay: deposits },
    text: "Bricks need stone, coal and energy at once: your first three-input factory. Mine what your land holds, and pipe the Brickworks to your Yard gate: a neighbour's stone or coal comes by itself." }

# The Eras' chapters (1.4 §11: Loady opens each Era's chapter: what's new). A step of an Era waits until the player's
# town gets there.
- { id: era2Steel, chapter: 3, era: 2, stat: "produced:steel", amount: 1, gold: 200000, hint: { tool: build, building: steelMill },
    text: "Chapter 3 · Era 2! Your town finished its Great Dynamo. Steel is the new backbone: a Steel Mill makes it from iron ingots and coal, and every Era-2 good has a fresh Hub Order of its own." }
- { id: era2Track, chapter: 3, era: 2, stat: researched, amount: 30, gold: 300000, hint: { panel: research },
    text: "Era 2 brings new tracks (Steel, Wire, Concrete, Aluminium) and new Era tree items. Keep both lines of your Lab busy: thirty researches in all." }
- { id: era2Outskirts, chapter: 3, era: 2, stat: outskirtsGold, amount: 1, gold: 1000000, hint: { panel: research },
    text: "Room beyond your plot: research Survey the Outskirts, then tap one of the nine parcels set aside for you around your Yard group and buy it." }
- { id: era2Cathedral, chapter: 3, era: 2, stat: wonder, amount: 1, gold: 1000000, hint: { panel: hub },
    text: "The Copper Cathedral brings Era 3. Give it steel, concrete, copper wire or aluminium: turn a give switch on in Hub › Town & Wonder, or buy and give." }
- { id: era3Oil, chapter: 4, era: 3, stat: "produced:plastic", amount: 1, gold: 20000000, hint: { tool: build, building: "oilDerrick,refinery" },
    text: "Chapter 4 · Era 3: oil and machines. Pump oil from the new deposits and refine it into plastic: the composite pipe and the Grand Refinery Tower want it." }
- { id: era3Line, chapter: 4, era: 3, stat: "built:motorWorks", amount: 1, gold: 30000000, hint: { tool: build, building: motorWorks },
    text: "Motors need copper wire, aluminium and gears: a Motor Works makes them. And research Trunk Lines: a line to the next town is a second market, and links to players there." }
- { id: era4Chips, chapter: 5, era: 4, stat: "produced:circuits", amount: 1, gold: 500000000, hint: { tool: build, building: "rareEarthExcavator,circuitFab" },
    text: "Chapter 5 · Era 4: electronics. Dig rare earth and make circuits. Expeditions map the wilderness, and with the Outposts research you claim rich deposits out there." }
- { id: era5Titanium, chapter: 6, era: 5, stat: "produced:titanium", amount: 1, gold: 10000000000, hint: { tool: build, building: "titaniumMine,titaniumWorks" },
    text: "Chapter 6 · Era 5: the space age. Titanium, superconductors and spaceframes build your town's Space Elevator: its launch brings Legacy for everyone, then missions without end." }

