# The Era Wonders (1.4 §13): one per Era, built by everyone in the town with goods, in three stages of a sixth, a third
# and a half. Their sizes are fixed (rule 2): gold's worth of goods at base prices, split evenly over the stage's goods,
# the same in every town however many play there; every town that finished a Wonder before makes it 10% smaller for the
# towns after it, down to half (the trail). A stage takes at least a day to build once it's full.
# Each stage gives everyone in the town its perk for good; the last stage brings the next Era (the Space Elevator's, the
# Launch). Perks: energy (energy buildings make more), hubOrders, factories (factories make more), research (faster),
# everything (every building makes more).
# Eras 3 to 5 are provisional until phase C plays them in the model.
era:
  - id: greatDynamo
    era: 1
    name: The Great Dynamo
    description: The power plant of a new age. Its last stage brings Era 2.
    worth: 4300000000
    stages:
      - { share: 0.1667, goods: [bricks, planks, ironIngot], perk: { kind: energy, amount: 0.05 } }
      - { share: 0.3333, goods: [copperIngot, ironIngot, glass], perk: { kind: energy, amount: 0.05 } }
      - { share: 0.5, goods: [bricks, glass, copperIngot, planks] }

  - id: copperCathedral
    era: 2
    name: The Copper Cathedral
    description: A cathedral of copper and steel. Its last stage brings Era 3.
    worth: 84000000000
    stages:
      - { share: 0.1667, goods: [steel, concrete], perk: { kind: hubOrders, amount: 0.1 } }
      - { share: 0.3333, goods: [copperWire, aluminium, glass], perk: { kind: hubOrders, amount: 0.1 } }
      - { share: 0.5, goods: [steel, concrete, copperWire, aluminium] }

  - id: refineryTower
    era: 3
    name: The Grand Refinery Tower
    description: Oil becomes everything. Its last stage brings Era 4.
    worth: 1600000000000
    stages:
      - { share: 0.1667, goods: [plastic, steel], perk: { kind: factories, amount: 0.05 } }
      - { share: 0.3333, goods: [gears, motors, concrete], perk: { kind: factories, amount: 0.05 } }
      - { share: 0.5, goods: [plastic, motors, aluminium, gears] }

  - id: thinkingMachine
    era: 4
    name: The Thinking Machine
    description: A machine that thinks. Its last stage brings Era 5.
    worth: 32000000000000
    stages:
      - { share: 0.1667, goods: [circuits, batteries], perk: { kind: research, amount: 0.05 } }
      - { share: 0.3333, goods: [robots, circuits, copperWire], perk: { kind: research, amount: 0.05 } }
      - { share: 0.5, goods: [robots, batteries, motors, circuits] }

  - id: spaceElevator
    era: 5
    name: The Space Elevator
    description: The town's way to the stars. Its last stage is the Launch.
    worth: 630000000000000
    stages:
      - { share: 0.1667, goods: [titanium, superconductors, steel], perk: { kind: everything, amount: 0.05 } }
      - { share: 0.3333, goods: [spaceframes, robots], perk: { kind: everything, amount: 0.05 } }
      - { share: 0.5, goods: [spaceframes, superconductors, titanium] }

# The Monuments (1.4 §13): every Era gives each Yard one Monument site; its crew picks which of these to build there (each
# once). Built with gold by any resident from Company Level 5, in stages without end: a site's first stage costs
# firstStage × 10^(site's Era − 1), every stage 40% more than the last. Every stage gives every resident the perk.
# Perks: production, hubOrders, research (faster), cheaper (buildings, levels and parcels), yardSales (sellers in the Yard
# and on links get this much on top, paid by the market). cap: the most stages it gives a perk for (0: none).
monuments:
  firstStage: 100000000
  eraFactor: 10
  stageFactor: 1.4
  level: 5
  kinds:
    - { id: grandFountain, name: Grand Fountain, perk: production, amount: 0.03, cap: 0, description: "Every stage: +3% production for every resident." }
    - { id: clockTower, name: Clock Tower, perk: hubOrders, amount: 0.05, cap: 0, description: "Every stage: every resident's Hub Orders +5%." }
    - { id: observatory, name: Observatory, perk: research, amount: 0.03, cap: 10, description: "Every stage: research 3% faster for every resident (up to 30%)." }
    - { id: workshop, name: Workshop, perk: cheaper, amount: 0.03, cap: 10, description: "Every stage: buildings, levels and parcels 3% cheaper for every resident (up to 30%)." }
    - { id: lighthouse, name: Lighthouse, perk: yardSales, amount: 0.03, cap: 10, description: "Every stage: what residents sell in the Yard and on links pays 3% on top, paid by the market (up to 30%)." }
