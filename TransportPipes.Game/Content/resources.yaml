# Every good that flows through pipes (1.4 §10). price is the base price: the market pays it within your Hub Order and
# sells at 2.5×; every price between players is a multiple of it. Rates in the game are per minute.
# kind: how the pipe carries it (1.4 §9, the pipe's three lanes): power (cables), fluid (a slim pipe) or solid (a belt)
# Every Era brings one land resource and three or four goods; a building adds about four times the value per tile of
# one of the Era before.

