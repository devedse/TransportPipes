# Transport Pipes: one file to run the game and its database.
# 1. Change POSTGRES_PASSWORD (e.g. in a .env file next to this file).
# 2. docker compose up -d, then open http://<this-host>:8080 and create an account.
#    (In a clone of the repository you can also build the image yourself: docker compose up -d --build)
services:
  transportpipes:
    # beta_nightly is the newest build of any branch (master included), so a test server follows every push.
    # Use latest (or a version like 1.0.2) to only run builds of master.
    image: ghcr.io/devedse/transportpipes:beta_nightly
    build: .
    container_name: transportpipes
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__TransportPipes: "Host=transportpipes-db;Database=transportpipes;Username=transportpipes;Password=${POSTGRES_PASSWORD:-transportpipes}"
      # The gold a new player starts with
      TransportPipes__StartingGold: "500"
      # Creates the users admin and Devedse (password: a) when there are no users yet, only for testing
      # TransportPipes__SeedTestUsers: "true"
    depends_on:
      transportpipes-db:
        condition: service_healthy

  transportpipes-db:
    image: postgres:18-alpine
    container_name: transportpipes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: transportpipes
      POSTGRES_USER: transportpipes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transportpipes}
    volumes:
      # The database is stored next to this file in ./data/postgres. Back this up.
      # (PostgreSQL 18 keeps its files in /var/lib/postgresql/18/docker, so mount the parent.)
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transportpipes -d transportpipes"]
      interval: 5s
      timeout: 5s
      retries: 12
